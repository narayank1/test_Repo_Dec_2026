# what is the goal of the lint file
# Goal: whenever someone changes the python code, the linter checks
# if the syntax, format, indentation (linting) is correct or not.

name: Auto Lynter

on:
  push:
    paths: 
      - "*.py"

jobs:
  code:
    runs-on: ubuntu-latest

    # this step will automatically clone the code of current branch into the runner
    steps:
      - name: checkout/clone the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          
      - name: Docker Setup [Login to docker hub]
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Docker build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/dev-fe-master:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # this step will install the linter code
      - name: Install Linter
        run: pip install ruff

      # - name: Install dependencies
      #   run: pip install -r requirements.txt

      - name: check the file for linting
        run: ruff check .
